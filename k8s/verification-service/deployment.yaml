apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification-service
spec:
  replicas: 2   # Show scaling capability!
  selector:
    matchLabels:
      app: verification-service
  template:
    metadata:
      labels:
        app: verification-service
    spec:
      containers:
      - name: verification-service
        image: medverify/verification-service:latest
        imagePullPolicy: Never   # Use local image
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "medverify"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"