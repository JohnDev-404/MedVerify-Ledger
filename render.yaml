services:
  # --- 1. API Gateway Service ---
  - type: web
    name: medverify-gateway
    region: oregon
    runtime: docker
    plan: free
    envVars:
      - key: VERIFICATION_SERVICE_URL
        fromService:
          type: web
          name: medverify-verification
          property: hostport   # This gives "internal-hostname:port"
      - key: ADMIN_SERVICE_URL
        fromService:
          type: web
          name: medverify-admin
          property: hostport
      - key: SMS_WEBHOOK_URL
        fromService:
          type: web
          name: medverify-sms
          property: hostport
    dockerContext: ./services/api-gateway
    dockerfilePath: ./services/api-gateway/Dockerfile

  # --- 2. Verification Service ---
  - type: web
    name: medverify-verification
    region: oregon
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medverify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medverify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medverify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medverify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medverify-db
          property: password
    dockerContext: ./services/verification-service
    dockerfilePath: ./services/verification-service/Dockerfile

  # --- 3. Admin Service ---
  - type: web
    name: medverify-admin
    region: oregon
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medverify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medverify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medverify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medverify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medverify-db
          property: password
      - key: ADMIN_API_KEY
        value: ":E4-Tz9CpVvqT:4"
    dockerContext: ./services/admin-service
    dockerfilePath: ./services/admin-service/Dockerfile

  # --- 4. SMS Webhook Service ---
  # --- 4. SMS Webhook Service ---
  - type: web
    name: medverify-sms
    region: oregon
    runtime: docker
    plan: free
    envVars:
      - key: VERIFICATION_SERVICE_URL
        fromService:
          type: web
          name: medverify-verification
          property: hostport
    dockerContext: ./services/sms-webhook-service
    dockerfilePath: ./services/sms-webhook-service/Dockerfile

# --- PostgreSQL Database (Defined OUTSIDE services) ---
databases:
  - name: medverify-db
    plan: free
    databaseName: medverify      # Optional: default DB name
    user: medverify_user         # Optional: default username