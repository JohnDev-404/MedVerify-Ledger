services:
  # --- 1. API Gateway Service ---
  - type: web
    name: medverify-gateway
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: VERIFICATION_SERVICE_URL
        value: https://medverify-verification.onrender.com
      - key: ADMIN_SERVICE_URL
        value: https://medverify-admin.onrender.com
      - key: SMS_WEBHOOK_URL
        value: https://medverify-sms.onrender.com
    dockerContext: ./services/api-gateway
    dockerfilePath: ./services/api-gateway/Dockerfile

  # --- 2. Verification Service ---
  - type: web
    name: medverify-verification
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medverify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medverify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medverify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medverify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medverify-db
          property: password
    dockerContext: ./services/verification-service
    dockerfilePath: ./services/verification-service/Dockerfile

  # --- 3. Admin Service ---
  - type: web
    name: medverify-admin
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medverify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medverify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medverify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: medverify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medverify-db
          property: password
      - key: ADMIN_API_KEY
        value: ":E4-Tz9CpVvqT:4"
    dockerContext: ./services/admin-service
    dockerfilePath: ./services/admin-service/Dockerfile

  # --- 4. SMS Webhook Service ---
  - type: web
    name: medverify-sms
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: VERIFICATION_SERVICE_URL
        fromService:
          type: web
          name: medverify-verification
          property: hostport
      # ---------- ADD THESE TWILIO VARS ----------
      - key: TWILIO_ACCOUNT_SID
        value: "YOUR_TWILIO_ACCOUNT_SID"    # REPLACE with your SID
      - key: TWILIO_AUTH_TOKEN
        value: "YOUR_TWILIO_AUTH_TOKEN"     # REPLACE with your Auth Token
      - key: TWILIO_PHONE_NUMBER
        value: "+1234567890"               # REPLACE with your Twilio number
    dockerContext: ./services/sms-webhook-service
    dockerfilePath: ./services/sms-webhook-service/Dockerfile

# --- PostgreSQL Database ---
databases:
  - name: medverify-db
    plan: free
    region: oregon
    databaseName: medverify
    user: medverify_user