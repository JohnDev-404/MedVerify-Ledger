<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard · MedVerify</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ====== Base styles (same as before, with header color tweaks) ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 20px;
      background: #0b0e1a;
      transition: background 0.4s ease, color 0.4s ease;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, #0b0e1a 0%, #1a1f3a 30%, #2d1b4e 60%, #0f2b4a 100%);
      background-size: 400% 400%;
      animation: aurora 20s ease infinite;
    }
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.15), transparent),
                        radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.12), transparent),
                        radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.08), transparent),
                        radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.15), transparent);
      background-size: 200px 200px;
      animation: drift 60s linear infinite;
      opacity: 0.6;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50px, -30px); }
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      animation: fadeUp 0.8s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ----- Glass Cards ----- */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      margin-bottom: 24px;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      border-color: rgba(99, 102, 241, 0.2);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    }

    /* ----- Light Theme ----- */
    body.light {
      background: #f1f5f9;
      color: #0f172a;
    }
    body.light::before {
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 50%, #e8eeff 100%);
      animation: none;
    }
    body.light::after { opacity: 0.2; }
    body.light .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08);
    }
    body.light .card:hover {
      border-color: #2563eb;
      box-shadow: 0 25px 50px -12px rgba(37,99,235,0.12);
    }
    body.light .table th {
      background: rgba(241, 245, 249, 0.8);
      color: #1e293b;
    }
    body.light .table td {
      border-bottom-color: #e2e8f0;
      color: #1e293b;
    }
    body.light .table tbody tr:hover {
      background: rgba(37, 99, 235, 0.04);
    }
    body.light .badge-success { background: #dcfce7; color: #166534; }
    body.light .badge-danger { background: #fee2e2; color: #991b1b; }
    body.light .subtitle { color: #475569; }
    body.light label { color: #334155; }
    body.light input[type="text"],
    body.light input[type="password"] {
      background: white;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    body.light input:focus {
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }
    body.light .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    body.light .btn-secondary:hover {
      background: #cbd5e1;
    }
    body.light .alert-success {
      background: #dcfce7;
      color: #166534;
    }
    body.light .alert-error {
      background: #fee2e2;
      color: #991b1b;
    }
    body.light .modal {
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(255,255,255,0.5);
    }
    body.light .modal h3 { color: #0f172a; }
    body.light .modal p { color: #475569; }
    body.light .batch-edit-input {
      background: white;
      color: #0f172a;
    }
    body.light .action-btn:hover {
      background: rgba(0,0,0,0.04);
    }
    body.light .theme-toggle {
      background: rgba(255,255,255,0.8);
      border-color: rgba(0,0,0,0.05);
      color: #0f172a;
    }

    /* ----- Header with dynamic "Admin" color ----- */
    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    /* "Admin" part: dark in light mode, white in dark mode */
    .admin-part {
      color: #f1f5f9;  /* default for dark mode */
      transition: color 0.4s ease;
    }
    body.light .admin-part {
      color: #0f172a;  /* dark in light mode */
    }
    /* "Dashboard" part: always blue */
    .highlight-part {
      color: #2563eb;  /* solid blue */
    }

    .subtitle {
      font-weight: 300;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
    }

    /* ----- Back link, form, buttons, etc. (same as before) ----- */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 20px;
      transition: color 0.2s, transform 0.2s;
    }
    .back-link:hover {
      color: #a78bfa;
      transform: translateX(-4px);
    }

    .form-group { margin-bottom: 1.25rem; }
    label {
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 18px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      outline: none;
    }
    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      background: rgba(255, 255, 255, 0.08);
    }

    .api-key-input {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .api-key-input input { flex: 1; }

    /* ----- Buttons (reduced glow) ----- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }
    .btn:active { transform: scale(0.96); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
    }
    .btn-danger:hover {
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 0.8rem;
      border-radius: 12px;
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25);
    }
    .btn-success:hover {
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3);
    }

    /* ----- Alerts ----- */
    .alert {
      padding: 14px 18px;
      border-radius: 16px;
      margin-top: 12px;
      display: none;
      font-weight: 500;
      backdrop-filter: blur(4px);
      border: 1px solid transparent;
    }
    .alert-success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.25);
      color: #86efac;
    }
    .alert-error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* ----- Table ----- */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      padding: 4px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .table th {
      text-align: left;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.03);
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .table td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
      color: #e2e8f0;
    }
    .table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .badge {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-success {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
    }
    .badge-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .action-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s, transform 0.2s;
      color: #94a3b8;
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: scale(1.1);
    }
    .action-btn.edit-btn:hover { color: #818cf8; }
    .action-btn.delete-btn:hover { color: #ef4444; }

    .batch-edit-input {
      display: none;
      width: 100%;
      max-width: 160px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 2px solid #818cf8;
      background: rgba(255,255,255,0.06);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    .save-edit-btn, .cancel-edit-btn { display: none; }

    /* ----- Modal ----- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: rgba(30, 35, 60, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 40px 80px -16px rgba(0,0,0,0.8);
      text-align: center;
      animation: scaleUp 0.3s ease;
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal h3 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }
    .modal p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .modal .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* ----- Spinner ----- */
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #818cf8;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }

    /* ----- Theme toggle ----- */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.10);
      transform: scale(1.02);
    }

    /* ----- Responsive ----- */
    @media (max-width: 640px) {
      .container { padding: 0; }
      .card { padding: 1.25rem; }
      h1 { font-size: 1.8rem; }
      .api-key-input { flex-wrap: wrap; }
      .api-key-input input { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <!-- Theme Toggle -->
  <div class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeLabel">Dark</span>
  </div>

  <div class="container">
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Verification</a>

    <div class="card">
      <h1>
        <span class="admin-part">Admin</span>
        <span class="highlight-part">Dashboard</span>
      </h1>
      <p class="subtitle"><i class="fas fa-database" style="margin-right: 6px; opacity: 0.6;"></i> Manage verified batches in the MedVerify ledger</p>

      <div class="form-group">
        <label for="apiKey"><i class="fas fa-key"></i> API Key (required for all actions)</label>
        <div class="api-key-input">
          <input type="password" id="apiKey" placeholder="Enter admin API key..." value=":E4-Tz9CpVvqT:4" />
          <button class="btn" onclick="setApiKey()"><i class="fas fa-save"></i> Save</button>
        </div>
      </div>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid rgba(255,255,255,0.06);" />

      <div class="form-group">
        <label for="batchInput"><i class="fas fa-plus-circle"></i> Add New Batch</label>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <input type="text" id="batchInput" placeholder="e.g. BATCH2024" style="flex:1;" />
          <button class="btn" id="addBtn"><i class="fas fa-plus"></i> Add Batch</button>
        </div>
      </div>
      <div id="addResult"></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <h2 style="font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: inherit;">
          <i class="fas fa-list-ul" style="color: #818cf8;"></i> Verified Batches
        </h2>
        <button class="btn btn-secondary btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="batchList">
        <div class="loading-text"><span class="spinner"></span> Loading batches...</div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3><i class="fas fa-exclamation-triangle" style="color: #ef4444; margin-right: 8px;"></i> Confirm Deletion</h3>
      <p id="deleteModalMessage">Are you sure you want to delete this batch?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDeleteBtn"><i class="fas fa-times"></i> Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>
  </div>

  <script>
    // (JavaScript unchanged from previous version)
    // ----- Theme Toggle -----
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light');
        themeIcon.className = 'fas fa-sun';
        themeLabel.textContent = 'Light';
        localStorage.setItem('medVerifyTheme', 'light');
      } else {
        document.body.classList.remove('light');
        themeIcon.className = 'fas fa-moon';
        themeLabel.textContent = 'Dark';
        localStorage.setItem('medVerifyTheme', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('medVerifyTheme') || 'dark';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
      const current = document.body.classList.contains('light') ? 'dark' : 'light';
      applyTheme(current);
    });

    // ----- API Key -----
    let apiKey = localStorage.getItem('medVerifyApiKey') || ':E4-Tz9CpVvqT:4';
    document.getElementById('apiKey').value = apiKey;

    function setApiKey() {
      apiKey = document.getElementById('apiKey').value.trim();
      localStorage.setItem('medVerifyApiKey', apiKey);
      const btn = event.target.closest('.btn');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
      setTimeout(() => { btn.innerHTML = original; }, 1500);
      loadBatches();
    }

    // ----- Fetch helper -----
    async function fetchWithAuth(url, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'api-key': apiKey,
        ...options.headers
      };
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`HTTP ${response.status}: ${text || response.statusText}`);
      }
      return response.json();
    }

    // ----- Load Batches -----
    async function loadBatches() {
      const container = document.getElementById('batchList');
      container.innerHTML = `<div class="loading-text"><span class="spinner"></span> Loading batches...</div>`;

      try {
        const data = await fetchWithAuth('/api/admin/batches');
        if (!data || data.length === 0) {
          container.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 20px;"><i class="fas fa-inbox" style="font-size: 2rem; display: block; margin-bottom: 8px; opacity: 0.3;"></i>No batches in the ledger yet.</p>';
          return;
        }

        container.innerHTML = `
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr><th>ID</th><th>Batch Number</th><th>Created At</th><th style="text-align: right;">Actions</th></tr>
              </thead>
              <tbody>
                ${data.map(b => `
                  <tr data-batch="${b.batch_number}">
                    <td style="font-weight: 600; color: #818cf8;">${b.id}</td>
                    <td>
                      <span class="batch-text">${b.batch_number}</span>
                      <input type="text" class="batch-edit-input" value="${b.batch_number}" />
                      <button class="save-edit-btn btn btn-success btn-sm" style="display:none;"><i class="fas fa-check"></i> Save</button>
                      <button class="cancel-edit-btn btn btn-secondary btn-sm" style="display:none;"><i class="fas fa-times"></i> Cancel</button>
                    </td>
                    <td style="font-size: 0.8rem; color: #94a3b8;">${new Date(b.created_at).toLocaleString()}</td>
                    <td style="text-align: right;">
                      <div class="action-btns">
                        <button class="action-btn edit-btn" data-batch="${b.batch_number}" title="Edit"><i class="fas fa-pen"></i></button>
                        <button class="action-btn delete-btn" data-batch="${b.batch_number}" title="Delete"><i class="fas fa-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        // Delete
        container.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const batch = btn.dataset.batch;
            showDeleteModal(batch);
          });
        });

        // Edit
        container.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const row = btn.closest('tr');
            const textSpan = row.querySelector('.batch-text');
            const input = row.querySelector('.batch-edit-input');
            const saveBtn = row.querySelector('.save-edit-btn');
            const cancelBtn = row.querySelector('.cancel-edit-btn');
            const batch = btn.dataset.batch;
            textSpan.style.display = 'none';
            input.style.display = 'inline-block';
            input.value = batch;
            saveBtn.style.display = 'inline-block';
            cancelBtn.style.display = 'inline-block';
            btn.style.display = 'none';
          });
        });

        // Save
        container.querySelectorAll('.save-edit-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const row = btn.closest('tr');
            const oldBatch = row.dataset.batch;
            const input = row.querySelector('.batch-edit-input');
            const newBatch = input.value.trim();
            if (!newBatch) { alert('Batch number cannot be empty'); return; }
            if (newBatch === oldBatch) {
              // Cancel
              const editBtn = row.querySelector('.edit-btn');
              const textSpan = row.querySelector('.batch-text');
              const saveBtn = row.querySelector('.save-edit-btn');
              const cancelBtn = row.querySelector('.cancel-edit-btn');
              textSpan.style.display = 'inline';
              input.style.display = 'none';
              saveBtn.style.display = 'none';
              cancelBtn.style.display = 'none';
              editBtn.style.display = 'inline-block';
              return;
            }
            try {
              await fetchWithAuth(`/api/admin/batches/${oldBatch}`, {
                method: 'PUT',
                body: JSON.stringify({ new_batch_number: newBatch })
              });
              loadBatches();
            } catch (err) {
              alert('Update failed: ' + err.message);
            }
          });
        });

        // Cancel
        container.querySelectorAll('.cancel-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const row = btn.closest('tr');
            const editBtn = row.querySelector('.edit-btn');
            const textSpan = row.querySelector('.batch-text');
            const input = row.querySelector('.batch-edit-input');
            const saveBtn = row.querySelector('.save-edit-btn');
            const cancelBtn = row.querySelector('.cancel-edit-btn');
            textSpan.style.display = 'inline';
            input.style.display = 'none';
            saveBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
            editBtn.style.display = 'inline-block';
          });
        });

      } catch (err) {
        container.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Error loading batches: ${err.message}</div>`;
      }
    }

    // ----- Delete Modal -----
    let pendingDeleteBatch = null;
    function showDeleteModal(batch) {
      pendingDeleteBatch = batch;
      document.getElementById('deleteModalMessage').textContent = `Are you sure you want to delete batch "${batch}"? This cannot be undone.`;
      document.getElementById('deleteModal').classList.add('active');
    }
    function hideDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      pendingDeleteBatch = null;
    }
    document.getElementById('cancelDeleteBtn').addEventListener('click', hideDeleteModal);
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!pendingDeleteBatch) return;
      const batch = pendingDeleteBatch;
      try {
        await fetchWithAuth(`/api/admin/batches/${batch}`, { method: 'DELETE' });
        hideDeleteModal();
        loadBatches();
      } catch (err) {
        alert('Delete failed: ' + err.message);
        hideDeleteModal();
      }
    });
    document.getElementById('deleteModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideDeleteModal();
    });

    // ----- Add Batch -----
    document.getElementById('addBtn').addEventListener('click', async () => {
      const batchInput = document.getElementById('batchInput');
      const batch = batchInput.value.trim();
      const resultDiv = document.getElementById('addResult');
      if (!batch) {
        resultDiv.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-triangle"></i> Please enter a batch number.</div>';
        return;
      }
      try {
        await fetchWithAuth('/api/admin/batches', {
          method: 'POST',
          body: JSON.stringify({ batch_number: batch })
        });
        resultDiv.innerHTML = `<div class="alert alert-success"><i class="fas fa-check-circle"></i> Batch <strong>${batch}</strong> added successfully!</div>`;
        batchInput.value = '';
        loadBatches();
      } catch (err) {
        if (err.message.includes('409')) {
          resultDiv.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Batch <strong>${batch}</strong> already exists.</div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> Error: ${err.message}</div>`;
        }
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadBatches);
    document.getElementById('batchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    loadBatches();
  </script>
</body>
</html>
