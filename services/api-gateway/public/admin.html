<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MedVerify</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }
    h1 { font-size: 2rem; color: #0f172a; margin-bottom: 0.5rem; }
    h1 span { color: #2563eb; }
    .subtitle { color: #475569; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { font-weight: 600; color: #1e293b; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      font-size: 1rem;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .btn {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
    }
    .btn:hover { background: #1d4ed8; transform: scale(1.02); }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    .table th, .table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .table th { background: #f1f5f9; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 1rem; display: none; }
    .alert-success { background: #dcfce7; color: #166534; display: block; }
    .alert-error { background: #fee2e2; color: #991b1b; display: block; }
    .api-key-input { display: flex; gap: 10px; align-items: center; }
    .api-key-input input { flex: 1; }
    .back-link { color: #2563eb; text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
    .action-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btns .edit-btn, .action-btns .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .action-btns .edit-btn:hover { background: #dbeafe; }
    .action-btns .delete-btn:hover { background: #fee2e2; }
    .batch-edit-input { display: none; width: 100%; padding: 4px 8px; border-radius: 6px; border: 2px solid #2563eb; }
    .save-edit-btn, .cancel-edit-btn { display: none; }
  </style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">← Back to Verification</a>

  <div class="card">
    <h1>Admin <span>Dashboard</span></h1>
    <p class="subtitle">Manage verified batches in the MedVerify ledger</p>

    <!-- API Key Input -->
    <div class="form-group">
      <label for="apiKey">API Key (required for all actions)</label>
      <div class="api-key-input">
        <input type="password" id="apiKey" placeholder="Enter admin API key..." value=":E4-Tz9CpVvqT:4">
        <button class="btn" onclick="setApiKey()">Save</button>
      </div>
    </div>

    <hr style="margin: 20px 0; border-color: #e2e8f0;">

    <!-- Add Batch Form -->
    <div class="form-group">
      <label for="batchInput">Add New Batch</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="batchInput" placeholder="e.g. BATCH2024" style="flex:1;">
        <button class="btn" id="addBtn">Add Batch</button>
      </div>
    </div>
    <div id="addResult"></div>
  </div>

  <!-- List of Batches -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.2rem;">Verified Batches</h2>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
    <div id="batchList">
      <p style="color: #94a3b8;">Loading...</p>
    </div>
  </div>
</div>

<script>
  // -------- API Key Management --------
  let apiKey = localStorage.getItem('medVerifyApiKey') || ':E4-Tz9CpVvqT:4';
  document.getElementById('apiKey').value = apiKey;

  function setApiKey() {
    apiKey = document.getElementById('apiKey').value.trim();
    localStorage.setItem('medVerifyApiKey', apiKey);
    alert('API Key saved!');
    loadBatches();
  }

  // -------- Helper: Fetch with API Key --------
  async function fetchWithAuth(url, options = {}) {
    const headers = {
      'Content-Type': 'application/json',
      'api-key': apiKey,
      ...options.headers
    };
    const response = await fetch(url, { ...options, headers });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(`HTTP ${response.status}: ${text || response.statusText}`);
    }
    return response.json();
  }

  // -------- Load Batches --------
  async function loadBatches() {
    const container = document.getElementById('batchList');
    try {
      const data = await fetchWithAuth('/api/admin/batches');
      if (data.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8;">No batches in the ledger yet.</p>';
        return;
      }
      container.innerHTML = `
        <table class="table">
          <thead>
            <tr><th>ID</th><th>Batch Number</th><th>Created At</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.map(b => `
              <tr data-batch="${b.batch_number}">
                <td>${b.id}</td>
                <td>
                  <span class="batch-text">${b.batch_number}</span>
                  <input type="text" class="batch-edit-input" value="${b.batch_number}">
                  <button class="save-edit-btn btn btn-sm" style="background: #16a34a; display:none;">Save</button>
                  <button class="cancel-edit-btn btn btn-sm" style="background: #6b7280; display:none;">Cancel</button>
                </td>
                <td>${new Date(b.created_at).toLocaleString()}</td>
                <td>
                  <div class="action-btns">
                    <button class="edit-btn" data-batch="${b.batch_number}">✏️</button>
                    <button class="delete-btn" data-batch="${b.batch_number}">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      // Attach event listeners for edit and delete buttons
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const batch = btn.dataset.batch;
          if (!confirm(`Delete batch "${batch}"?`)) return;
          try {
            await fetchWithAuth(`/api/admin/batches/${batch}`, { method: 'DELETE' });
            loadBatches();
          } catch (err) {
            alert('Delete failed: ' + err.message);
          }
        });
      });

      container.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const row = btn.closest('tr');
          const textSpan = row.querySelector('.batch-text');
          const input = row.querySelector('.batch-edit-input');
          const saveBtn = row.querySelector('.save-edit-btn');
          const cancelBtn = row.querySelector('.cancel-edit-btn');
          const batch = btn.dataset.batch;
          textSpan.style.display = 'none';
          input.style.display = 'inline-block';
          input.value = batch;
          saveBtn.style.display = 'inline-block';
          cancelBtn.style.display = 'inline-block';
          btn.style.display = 'none';
        });
      });

      container.querySelectorAll('.save-edit-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const row = btn.closest('tr');
          const oldBatch = row.dataset.batch;
          const input = row.querySelector('.batch-edit-input');
          const newBatch = input.value.trim();
          if (!newBatch) { alert('Batch number cannot be empty'); return; }
          if (newBatch === oldBatch) {
            // Cancel edit
            const editBtn = row.querySelector('.edit-btn');
            const textSpan = row.querySelector('.batch-text');
            const saveBtn = row.querySelector('.save-edit-btn');
            const cancelBtn = row.querySelector('.cancel-edit-btn');
            textSpan.style.display = 'inline';
            input.style.display = 'none';
            saveBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
            editBtn.style.display = 'inline-block';
            return;
          }
          try {
            await fetchWithAuth(`/api/admin/batches/${oldBatch}`, {
              method: 'PUT',
              body: JSON.stringify({ new_batch_number: newBatch })
            });
            loadBatches();
          } catch (err) {
            alert('Update failed: ' + err.message);
          }
        });
      });

      container.querySelectorAll('.cancel-edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const row = btn.closest('tr');
          const editBtn = row.querySelector('.edit-btn');
          const textSpan = row.querySelector('.batch-text');
          const input = row.querySelector('.batch-edit-input');
          const saveBtn = row.querySelector('.save-edit-btn');
          const cancelBtn = row.querySelector('.cancel-edit-btn');
          textSpan.style.display = 'inline';
          input.style.display = 'none';
          saveBtn.style.display = 'none';
          cancelBtn.style.display = 'none';
          editBtn.style.display = 'inline-block';
        });
      });

    } catch (err) {
      container.innerHTML = `<p style="color: #dc2626;">Error loading batches: ${err.message}</p>`;
    }
  }

  // -------- Add Batch --------
  document.getElementById('addBtn').addEventListener('click', async () => {
    const batchInput = document.getElementById('batchInput');
    const batch = batchInput.value.trim();
    const resultDiv = document.getElementById('addResult');

    if (!batch) {
      resultDiv.innerHTML = '<div class="alert alert-error">Please enter a batch number.</div>';
      return;
    }

    try {
      await fetchWithAuth('/api/admin/batches', {
        method: 'POST',
        body: JSON.stringify({ batch_number: batch })
      });
      resultDiv.innerHTML = `<div class="alert alert-success">✅ Batch <strong>${batch}</strong> added successfully!</div>`;
      batchInput.value = '';
      loadBatches();
    } catch (err) {
      if (err.message.includes('409')) {
        resultDiv.innerHTML = `<div class="alert alert-error">⚠️ Batch <strong>${batch}</strong> already exists.</div>`;
      } else {
        resultDiv.innerHTML = `<div class="alert alert-error">❌ Error: ${err.message}</div>`;
      }
    }
  });

  // -------- Refresh --------
  document.getElementById('refreshBtn').addEventListener('click', loadBatches);

  // -------- Initial Load --------
  loadBatches();

  // Enter key to add
  document.getElementById('batchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });
</script>
</body>
</html>
