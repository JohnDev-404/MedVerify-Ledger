<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MedVerify</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.5);
    }
    h1 { font-size: 1.8rem; color: #0f172a; margin-bottom: 0.5rem; }
    h1 span { color: #2563eb; }
    p { color: #475569; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { font-weight: 600; color: #1e293b; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      font-size: 1rem;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    input:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
    }
    .btn:hover { background: #1d4ed8; transform: scale(1.02); }
    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
<div class="login-card">
  <h1>Admin <span>Login</span></h1>
  <p>Enter your credentials to access the dashboard.</p>

  <div class="error" id="loginError">Invalid API key. Please try again.</div>

  <div class="form-group">
    <label for="apiKeyInput">API Key</label>
    <input type="password" id="apiKeyInput" placeholder="Enter your admin API key...">
  </div>
  <button class="btn" id="loginBtn">Login</button>
</div>

<script>
  document.getElementById('loginBtn').addEventListener('click', () => {
    const key = document.getElementById('apiKeyInput').value.trim();
    const errorEl = document.getElementById('loginError');

    if (!key) {
      errorEl.textContent = 'Please enter an API key.';
      errorEl.classList.add('show');
      return;
    }

    // Save the key and redirect
    localStorage.setItem('medVerifyApiKey', key);
window.location.href = '/admin';  });

  // Enter key support
  document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
</script>
</body>
</html>
