<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · MedVerify</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ====== Base styles (same as dashboard, with header tweaks) ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b0e1a;
      transition: background 0.4s ease, color 0.4s ease;
      color: #e2e8f0;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, #0b0e1a 0%, #1a1f3a 30%, #2d1b4e 60%, #0f2b4a 100%);
      background-size: 400% 400%;
      animation: aurora 20s ease infinite;
    }
    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.15), transparent),
                        radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.1), transparent),
                        radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.12), transparent),
                        radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.08), transparent),
                        radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.2), transparent),
                        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.15), transparent);
      background-size: 200px 200px;
      animation: drift 60s linear infinite;
      opacity: 0.6;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50px, -30px); }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp 0.8s ease-out;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .login-card:hover {
      border-color: rgba(99, 102, 241, 0.2);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Light theme */
    body.light {
      background: #f1f5f9;
      color: #0f172a;
    }
    body.light::before {
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 50%, #e8eeff 100%);
      animation: none;
    }
    body.light::after { opacity: 0.2; }
    body.light .login-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08);
    }
    body.light .login-card:hover {
      border-color: #2563eb;
      box-shadow: 0 25px 50px -12px rgba(37,99,235,0.12);
    }
    body.light .subtitle { color: #475569; }
    body.light label { color: #334155; }
    body.light input[type="password"] {
      background: white;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    body.light input:focus {
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }
    body.light .btn {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }
    body.light .btn:hover {
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }
    body.light .error {
      background: #fee2e2;
      color: #991b1b;
    }
    body.light .theme-toggle {
      background: rgba(255,255,255,0.8);
      border-color: rgba(0,0,0,0.05);
      color: #0f172a;
    }

    /* ----- Header with dynamic "Admin" color ----- */
    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .admin-part {
      color: #f1f5f9;  /* white in dark mode */
      transition: color 0.4s ease;
    }
    body.light .admin-part {
      color: #0f172a;  /* black in light mode */
    }
    .highlight-part {
      color: #2563eb;  /* always blue */
    }

    .subtitle {
      font-weight: 300;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    /* ----- Form, button, etc. (same as before) ----- */
    .form-group { margin-bottom: 1.25rem; }
    label {
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 18px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      outline: none;
    }
    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
      background: rgba(255, 255, 255, 0.08);
    }

    /* ----- Button (reduced glow, no pulse) ----- */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
    }
    .btn:active { transform: scale(0.96); }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 1rem;
      display: none;
      font-weight: 500;
    }
    .error.show { display: block; }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-toggle:hover {
      background: rgba(255,255,255,0.10);
      transform: scale(1.02);
    }

    @media (max-width: 480px) {
      .login-card { padding: 1.75rem; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <!-- Theme Toggle -->
  <div class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon" id="themeIcon"></i>
    <span id="themeLabel">Dark</span>
  </div>

  <div class="login-card">
    <h1>
      <span class="admin-part">Admin</span>
      <span class="highlight-part">Login</span>
    </h1>
    <p class="subtitle"><i class="fas fa-lock" style="margin-right: 6px; opacity: 0.6;"></i> Enter your API key to access the dashboard.</p>

    <div class="error" id="loginError"><i class="fas fa-exclamation-circle"></i> Invalid API key. Please try again.</div>

    <div class="form-group">
      <label for="apiKeyInput"><i class="fas fa-key"></i> API Key</label>
      <input type="password" id="apiKeyInput" placeholder="Enter your admin API key..." value="" />
    </div>
    <button class="btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
  </div>

  <script>
    // ----- Theme Toggle -----
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light');
        themeIcon.className = 'fas fa-sun';
        themeLabel.textContent = 'Light';
        localStorage.setItem('medVerifyTheme', 'light');
      } else {
        document.body.classList.remove('light');
        themeIcon.className = 'fas fa-moon';
        themeLabel.textContent = 'Dark';
        localStorage.setItem('medVerifyTheme', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('medVerifyTheme') || 'dark';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
      const current = document.body.classList.contains('light') ? 'dark' : 'light';
      applyTheme(current);
    });

    // ----- Login Logic -----
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const key = document.getElementById('apiKeyInput').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!key) {
        errorEl.textContent = 'Please enter an API key.';
        errorEl.classList.add('show');
        return;
      }

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: key })
        });

        if (!response.ok) {
          const data = await response.json();
          errorEl.textContent = data.error || 'Invalid API key.';
          errorEl.classList.add('show');
          return;
        }

        localStorage.setItem('medVerifyApiKey', key);
        window.location.href = '/admin?loggedIn=true';
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.add('show');
      }
    });

    document.getElementById('apiKeyInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
